<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty - Catálogo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="bg-gray-800 border-b border-gray-700 p-4">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold text-green-400">Rick & Morty Hub</h1>
      <div class="flex items-center gap-4">
        <span id="user-display" class="text-sm font-medium text-gray-300"></span>
        <a href="account.html" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded text-sm transition">Mi Cuenta</a>
        <button id="logout-btn" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded text-sm transition">Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6">
    <div id="loading" class="text-center py-20 text-xl text-green-400 font-semibold">Cargando personajes...</div>
    <div id="character-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden"></div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
