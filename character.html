<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Personaje</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="bg-gray-800 border-b border-gray-700 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-green-400 font-bold hover:underline">← Volver al catálogo</a>
      <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm transition">Cerrar Sesión</button>

  <main class="max-w-4xl mx-auto p-4 md:p-6">
    <div id="loading" class="text-center py-20 text-xl text-green-400 font-semibold">Cargando detalles...</div>
    <div id="detail-card" class="bg-gray-800 border border-gray-700 rounded-lg p-6 md:p-8 flex flex-col md:flex-row gap-6 hidden"></div>

  <script type="module" src="js/character.js"></script>
