<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <header class="bg-gray-800 border-b border-gray-700 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-green-400 font-bold hover:underline">← Volver al catálogo</a>
      <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm transition">Cerrar Sesión</button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 md:p-6 mt-6">
    <div class="bg-gray-800 border border-gray-700 p-6 rounded-lg shadow-lg">
      <h2 class="text-2xl font-bold mb-6 text-green-400 text-center">Editar Mi Cuenta</h2>

      <p id="success-msg" class="text-green-400 bg-green-900/40 p-3 rounded mb-4 text-center text-sm hidden">
        ¡Datos actualizados con éxito!
      </p>

      <form id="account-form" class="space-y-4" novalidate>
        <div>
          <label class="block text-sm font-medium mb-1">Nombre</label>
          <input type="text" id="name" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-green-400">
          <p id="error-name" class="text-red-400 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Apellido</label>
          <input type="text" id="surname" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-green-400">
          <p id="error-surname" class="text-red-400 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Correo Electrónico</label>
          <input type="email" id="email" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-green-400">
          <p id="error-email" class="text-red-400 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Nueva Contraseña (opcional)</label>
          <input type="password" id="password" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-green-400">
          <p id="error-password" class="text-red-400 text-xs mt-1 hidden"></p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Confirmar Nueva Contraseña</label>
          <input type="password" id="confirm-password" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-green-400">
          <p id="error-confirm-password" class="text-red-400 text-xs mt-1 hidden"></p>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">
          Guardar Cambios
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="js/account.js"></script>
</body>
</html>
